<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Whisper-clone</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=20261014-drive1">
  <script defer src="vendor/ort/ort.min.js"></script>
  <script defer src="vendor/vad/bundle.min.js"></script>
  <script defer src="vendor/msal/msal-browser.min.js"></script>
  <script defer src="vendor/jszip/jszip.min.js"></script>
  <script type="module" src="js/app.mjs?v=20261014-drive1"></script>
</head>
<body>
  <div class="privacy-controls">
    <input id="privacyCode" type="text" inputmode="numeric" autocomplete="off" spellcheck="false">
    <button id="privacyToggle" class="privacy-toggle" type="button"></button>
  </div>
  <dialog id="privacyView" class="privacy-view" aria-labelledby="demoTitle">
    <div class="demo-top-bar">
      <button type="button">Back to front page</button>
      <div class="demo-top-center">
        <button type="button">Guide</button>
        <button type="button">Status and updates</button>
        <div class="demo-clinical-tools">
          <span>Clinical tools:</span>
          <button class="demo-select" type="button">Select</button>
        </div>
      </div>
      <div class="demo-top-right">
        <button type="button">Prices</button>
        <button class="demo-select" type="button">English</button>
      </div>
    </div>
    <div class="demo-recording-area">
      <div class="demo-heading">
        <h1 id="demoTitle">Translator</h1>
        <button type="button">Back to notes</button>
      </div>
      <div class="demo-timer">Recording Timer: 0 sec</div>
      <div class="demo-record-buttons">
        <button class="demo-start" type="button">Start</button>
        <button type="button" disabled>Pause</button>
        <button type="button" disabled>Stop</button>
        <button type="button" disabled>Abort</button>
      </div>
      <p class="demo-error">Error: Unable to initiate recording.</p>
      <div class="demo-panels">
        <section class="demo-panel">
          <div class="demo-language-field">
            <span id="demoLanguageA">Your language</span>
            <button class="demo-select" type="button" aria-labelledby="demoLanguageA demoLanguageAValue"><span id="demoLanguageAValue">Norwegian</span></button>
          </div>
          <div class="demo-log"></div>
        </section>
        <section class="demo-panel">
          <div class="demo-language-field">
            <span id="demoLanguageB">Patient’s language</span>
            <button class="demo-select" type="button" aria-labelledby="demoLanguageB demoLanguageBValue"><span id="demoLanguageBValue">Polish</span></button>
          </div>
          <div class="demo-log"></div>
        </section>
      </div>
    </div>
  </dialog>
  <div id="recordingView" class="app">
    <aside aria-label="Recording history">
      <h2>History</h2>
      <div id="history" class="history"></div>
      <div id="historyDetail" class="history-detail" hidden></div>
    </aside>
    <main>
      <header>
        <h1>Whisper-clone</h1>
        <div class="remote-controls">
          <span id="linkStatus" class="small-status" role="status">Not linked</span>
          <button id="link" type="button">Link</button>
          <label class="switch"><input id="awake" type="checkbox"><span>Keep awake</span></label>
          <span id="awakeStatus" class="small-status" role="status">Off</span>
        </div>
      </header>
      <section class="record-panel" aria-label="Recording">
        <div class="record-status"><span id="dot" class="dot"></span><span id="recordStatus" role="status">Ready</span></div>
        <div id="timer" class="timer" aria-label="Elapsed recording time">00:00:00</div>
        <div class="record-buttons">
          <button id="start" class="primary" type="button">Start</button>
          <button id="pause" type="button" disabled>Pause</button>
          <button id="stop" type="button" disabled>Stop</button>
        </div>
      </section>
      <section class="transcript-panel" aria-label="File transcription">
        <div class="key-row">
          <input id="key" type="password" disabled aria-label="Soniox API key" autocomplete="off">
          <button id="import" type="button">Import Key</button>
          <button id="clear" type="button" disabled>Clear</button>
        </div>
        <div class="transcript-heading">
          <h2 id="model">Transcript</h2>
          <label id="speakerControl" class="switch" hidden><input id="speakers" type="checkbox"><span>Speaker labels</span></label>
        </div>
        <div class="file-row">
          <button id="upload" type="button">Upload File</button>
          <input id="file" type="file" accept="audio/*,.wav,.mp3,.m4a,.webm,.ogg,.flac,.aac,.mp4" hidden>
          <span id="fileName"></span>
          <div class="transcript-actions">
            <button id="transcribe" class="primary" type="button" disabled>Transcribe</button>
            <button id="exportDrive" type="button" disabled>EX.Drive</button>
            <button id="importDrive" type="button">Imp. Drive</button>
            <button id="clearDrive" type="button">Clear Drive</button>
          </div>
        </div>
        <textarea id="transcript" aria-label="Transcript" spellcheck="false"></textarea>
        <div id="message" role="status" aria-live="polite"></div>
        <div id="driveMessage" role="status" aria-live="polite"></div>
      </section>
    </main>
  </div>
  <dialog id="importDialog">
    <form id="importForm">
      <p>Do you wish to import from Drive?</p>
      <input id="backupPassword" type="password" placeholder="Backup password" aria-label="Backup password" autocomplete="off" required>
      <div class="dialog-buttons"><button id="cancelImport" type="button">Cancel</button><button id="confirmImport" class="primary" type="submit">Import</button></div>
      <div id="importStatus" role="status"></div>
    </form>
  </dialog>
</body>
</html>
